; ---------------------------------------------------------------------------
; Ajustes que sólo se aplican al cocinar y empaquetar para Android.
;
; Un móvil no tiene ni el presupuesto de sombreado ni el ancho de banda de
; memoria de un PC, así que aquí se apagan las técnicas que asumen ambos.
; Lumen, las sombras virtuales y Nanite no están soportados en el camino de
; render móvil: dejarlos activos no mejora nada y sí hace compilar shaders
; que no se van a usar.
; ---------------------------------------------------------------------------
[/Script/Engine.RendererSettings]
r.DynamicGlobalIlluminationMethod=0
r.ReflectionMethod=2
r.Shadow.Virtual.Enable=0
r.Nanite.ProjectEnabled=False
r.GenerateMeshDistanceFields=False
r.MobileHDR=True
r.Mobile.ShadingPath=0
r.Mobile.AntiAliasing=3
r.MSAACount=4
r.Mobile.AllowDitheredLODTransition=False
r.Mobile.VirtualTextures=False
r.Mobile.EnableStaticAndCSMShadowReceivers=True
r.Mobile.EnableMovableSpotlightsShadow=False
r.DefaultFeature.MotionBlur=False
r.DefaultFeature.Bloom=True
r.DefaultFeature.AmbientOcclusion=False

; La física es lo que no se puede recortar en un juego de coches: con menos de
; cuatro subpasos la suspensión de un monoplaza oscila y el coche flota. Se
; baja de ocho a cuatro, que es el mínimo con el que el comportamiento
; a 300 km/h sigue siendo estable, y se recupera el tiempo en otra parte.
[/Script/Engine.PhysicsSettings]
MaxSubsteps=4
MaxSubstepDeltaTime=0.011111
