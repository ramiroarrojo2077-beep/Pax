; ---------------------------------------------------------------------------
; Física. Un coche de F1 genera transitorios muy rápidos (5-6 G en frenada,
; cambios de carga aerodinámica instantáneos): sin substepping el solver de
; suspensión oscila y el coche "flota". 8 subpasos a 120 Hz es el mínimo
; razonable para que la simulación sea estable a 350 km/h.
; ---------------------------------------------------------------------------
[/Script/Engine.PhysicsSettings]
