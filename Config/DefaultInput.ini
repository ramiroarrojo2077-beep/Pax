; Pax usa Enhanced Input, pero los InputAction / InputMappingContext se
; construyen en C++ (ver PaxPlayerController) en lugar de como assets binarios,
; para que todo el input viva en el repositorio como texto revisable.
; Este archivo sólo fija los ajustes globales del subsistema.
[/Script/Engine.InputSettings]
bAltEnterTogglesFullscreen=True
bCaptureMouseOnLaunch=True
bEnableMouseSmoothing=False
; Con esto el ratón genera eventos táctiles en el editor, que es la forma de
; probar el mando en pantalla sin desplegar el APK en cada cambio.
bUseMouseForTouch=True
bViewAccelerationEnabled=False
DefaultViewportMouseCaptureMode=CapturePermanently_IncludingInitialMouseDown
DefaultViewportMouseLockMode=LockOnCapture
DefaultPlayerInputClass=/Script/EnhancedInput.EnhancedPlayerInput
DefaultInputComponentClass=/Script/EnhancedInput.EnhancedInputComponent

[/Script/EnhancedInput.EnhancedInputDeveloperSettings]
bSendTriggeredEventsWhenInputIsFlushed=False
